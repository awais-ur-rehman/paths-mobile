name: paths_mobile
description: "Paths private location feasibility harness."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  go_router: 17.2.2
  dio: 5.11.1
  maplibre_gl: 0.27.1
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.6
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/paths-symbol.png
    - assets/brand/paths-logo-ink.png
    - assets/onboarding/friends-walking.jpg
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/LilitaOne-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
